<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>7-ELEVEN - Tag Hạn Sử Dụng</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --7el-green: #008453;
            --7el-green-dark: #006e45;
            --7el-red: #EE2A24;
            --7el-orange: #F37022;
            --7el-dark: #1a202c;
            --glass-bg: rgba(255, 255, 255, 0.32);
            --glass-border: rgba(255, 255, 255, 0.55);
            --glass-highlight: rgba(255, 255, 255, 0.7);
            --liquid-shadow: rgba(31, 38, 135, 0.08);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, "SF Pro Text", "SF Pro Display", BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 24px 14px 120px 14px;
            background:
                radial-gradient(circle at 8% 15%, rgba(0, 132, 83, 0.10) 0%, transparent 42%),
                radial-gradient(circle at 92% 12%, rgba(243, 112, 34, 0.10) 0%, transparent 40%),
                radial-gradient(circle at 50% 100%, rgba(0, 132, 83, 0.06) 0%, transparent 50%),
                linear-gradient(160deg, #eef2f7 0%, #dde6f0 55%, #e7edf5 100%);
            background-attachment: fixed;
            color: var(--7el-dark); min-height: 100vh;
            display: flex; align-items: flex-start; justify-content: center;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            width: 100%; max-width: 720px;
            background: var(--glass-bg);
            backdrop-filter: blur(30px) saturate(190%); -webkit-backdrop-filter: blur(30px) saturate(190%);
            padding: 32px 26px; border-radius: 36px; border: 1px solid var(--glass-border);
            box-shadow: 0 20px 50px -10px var(--liquid-shadow), 0 2px 8px rgba(0,0,0,0.03),
                inset 0 1.5px 1px 0 var(--glass-highlight), inset 0 -8px 20px -10px rgba(0,0,0,0.04);
            position: relative; overflow: hidden;
        }
        .container::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; height: 40%;
            background: linear-gradient(180deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 100%);
            pointer-events: none; z-index: 0;
        }
        .container > * { position: relative; z-index: 1; }

        .brand-header { text-align: center; margin-bottom: 22px; }
        .brand-logo-text {
            font-size: 32px; font-weight: 800; letter-spacing: -1.2px; color: var(--7el-green);
            margin: 0 0 6px 0; text-transform: uppercase; filter: drop-shadow(0 2px 8px rgba(0,132,83,0.15));
        }
        .brand-logo-text span { color: var(--7el-red); }
        .stripes { display: flex; height: 5px; width: 90px; margin: 12px auto 0 auto; border-radius: 20px; overflow: hidden; }
        .stripe-orange { flex: 1; background: var(--7el-orange); }
        .stripe-red { flex: 1; background: var(--7el-red); }
        .stripe-green { flex: 1; background: var(--7el-green); }
        h3 {
            text-align: center; color: #4a5568; margin: 14px 0 0 0; font-size: 12.5px;
            font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; opacity: 0.7;
        }

        /* ===== Thanh công cụ ===== */
        .toolbar-row { display: flex; gap: 10px; margin-top: 10px; }
        .search-wrap { position: relative; flex: 1; min-width: 0; }
        .search-wrap input {
            width: 100%; padding: 13px 16px 13px 40px; font-size: 14.5px; font-weight: 500;
            border-radius: 15px; border: 1px solid rgba(255,255,255,0.55);
            background: rgba(120,120,128,0.12); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            color: var(--7el-dark); outline: none; font-family: inherit; transition: all 0.25s ease;
        }
        .search-wrap input:focus { background: rgba(255,255,255,0.75); border-color: rgba(0,132,83,0.4); box-shadow: 0 0 0 4px rgba(0,132,83,0.1); }
        .search-wrap::before { content: "🔎"; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 13px; opacity: 0.55; pointer-events: none; }
        .icon-square-btn {
            flex-shrink: 0; width: 46px; border: 1px solid rgba(255,255,255,0.55); border-radius: 15px;
            background: rgba(120,120,128,0.12); cursor: pointer; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s cubic-bezier(0.34,1.3,0.64,1); color: var(--7el-dark);
        }
        .icon-square-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.6); }
        .sort-select {
            flex: 1; min-width: 0; padding: 12px 14px; font-size: 13.5px; font-weight: 700; font-family: inherit;
            border-radius: 15px; border: 1px solid rgba(255,255,255,0.55); background: rgba(120,120,128,0.12);
            color: var(--7el-dark); outline: none; cursor: pointer;
        }
        .sort-select:focus { background: rgba(255,255,255,0.75); border-color: rgba(0,132,83,0.4); box-shadow: 0 0 0 4px rgba(0,132,83,0.1); }

        /* ===== Nút ===== */
        .btn {
            padding: 15px; border-radius: 17px; font-size: 14px; font-weight: 700; cursor: pointer;
            border: 1px solid rgba(255,255,255,0.3); letter-spacing: 0.2px; font-family: inherit;
            transition: all 0.2s cubic-bezier(0.34,1.3,0.64,1); position: relative; overflow: hidden;
        }
        .btn::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(180deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 55%); pointer-events: none; }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-print {
            display: none; width: 100%; margin-top: 14px; font-size: 13px;
            background: linear-gradient(135deg, #ff8c4a 0%, var(--7el-orange) 55%, #df570b 100%);
            color: #fff; box-shadow: 0 10px 24px rgba(243,112,34,0.3), inset 0 1px 1px rgba(255,255,255,0.4);
        }
        .btn-primary { background: linear-gradient(135deg, #14b378 0%, var(--7el-green) 55%, var(--7el-green-dark) 100%); color: #fff; box-shadow: 0 10px 24px rgba(0,132,83,0.3), inset 0 1px 1px rgba(255,255,255,0.4); }
        .btn-secondary { background: rgba(120,120,128,0.14); color: #2d3748; }

        /* ===== Danh sách ===== */
        .list-meta { display: flex; justify-content: space-between; align-items: center; margin: 20px 2px 12px 2px; font-size: 11.5px; font-weight: 700; color: #5a6474; opacity: 0.8; }
        .link-btn { border: none; background: none; font-family: inherit; font-size: 12px; font-weight: 700; color: var(--7el-green-dark); cursor: pointer; padding: 4px 2px; }
        .empty-hint, .loading { text-align: center; color: #5a6474; padding: 40px 20px; font-weight: 600; font-size: 14px; display: none; }
        #itemList { display: none; flex-direction: column; gap: 13px; }
        .item-card {
            background: rgba(255,255,255,0.42); border: 1px solid rgba(255,255,255,0.55); border-radius: 24px;
            padding: 16px 16px 14px 16px; box-shadow: 0 8px 22px rgba(0,0,0,0.035), inset 0 1px 1px rgba(255,255,255,0.5);
        }
        .item-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
        .food-name { color: var(--7el-dark); font-weight: 800; font-size: 15px; line-height: 1.3; }
        .item-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .pill-btn { border: none; border-radius: 12px; padding: 7px 11px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; font-family: inherit; transition: transform 0.2s cubic-bezier(0.34,1.3,0.64,1); }
        .pill-btn:active { transform: scale(0.92); }
        .pill-edit { background: rgba(0,132,83,0.14); color: var(--7el-green-dark); }
        .pill-delete { background: rgba(238,42,36,0.12); color: #b3241f; }
        .barcode-container { display: inline-block; margin-top: 2px; background: rgba(255,255,255,0.88); padding: 8px; border-radius: 13px; border: 1px solid rgba(255,255,255,0.7); }
        .barcode-img { max-width: 150px; height: auto; display: block; }
        .no-barcode { color: #b3241f; font-size: 12px; font-weight: 700; }
        .item-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
        .badge { display: inline-block; padding: 6px 12px; border-radius: 10px; font-size: 11.5px; font-weight: 700; background: rgba(120,120,128,0.12); color: #4a5568; border: 1px solid rgba(255,255,255,0.5); }
        .badge-expiry { color: var(--7el-red); background: rgba(238,42,36,0.09); }
        .badge-store { color: var(--7el-green-dark); background: rgba(0,132,83,0.09); }
        .badge-missing { color: #8a5a00; background: rgba(243,112,34,0.14); }

        /* ===== FAB ===== */
        .fab {
            position: fixed; right: 22px; bottom: calc(24px + env(safe-area-inset-bottom));
            width: 58px; height: 58px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.4); cursor: pointer;
            font-size: 27px; font-weight: 300; color: #fff; line-height: 1;
            background: linear-gradient(135deg, #14b378 0%, var(--7el-green) 55%, var(--7el-green-dark) 100%);
            box-shadow: 0 14px 34px rgba(0,132,83,0.4), 0 3px 10px rgba(0,0,0,0.15), inset 0 2px 3px rgba(255,255,255,0.5);
            display: flex; align-items: center; justify-content: center; z-index: 60;
            transition: transform 0.25s cubic-bezier(0.34,1.3,0.64,1);
        }
        .fab:active { transform: scale(0.88); }

        /* ===== Bottom sheet ===== */
        .sheet-overlay, .alert-overlay {
            display: none; position: fixed; inset: 0; z-index: 100;
            background: rgba(15,20,30,0.42); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            opacity: 0; transition: opacity 0.25s ease;
        }
        .sheet-overlay { align-items: flex-end; justify-content: center; }
        .alert-overlay { align-items: center; justify-content: center; z-index: 150; padding: 20px; }
        .sheet-overlay.open, .alert-overlay.open { display: flex; }
        .sheet-overlay.show, .alert-overlay.show { opacity: 1; }
        .sheet-box {
            width: 100%; max-width: 480px; background: rgba(255,255,255,0.92);
            backdrop-filter: blur(34px) saturate(180%); -webkit-backdrop-filter: blur(34px) saturate(180%);
            border-radius: 30px 30px 0 0; padding: 10px 24px calc(24px + env(safe-area-inset-bottom)) 24px;
            border: 1px solid rgba(255,255,255,0.6); border-bottom: none; box-shadow: 0 -16px 50px rgba(0,0,0,0.22);
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.32,0.9,0.44,1.1);
            max-height: 90vh; overflow-y: auto;
        }
        .sheet-overlay.show .sheet-box { transform: translateY(0); }
        .sheet-handle { width: 38px; height: 5px; border-radius: 3px; background: rgba(0,0,0,0.18); margin: 8px auto 18px auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .modal-header h2 { font-size: 17px; margin: 0; font-weight: 800; }
        .modal-close { border: none; background: rgba(120,120,128,0.14); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 13px; color: #4a5568; }
        .field-row { margin-bottom: 16px; }
        .field-row label { font-weight: 700; display: block; margin-bottom: 7px; color: #2d3748; font-size: 12.5px; }
        .field-row input, .field-row select {
            width: 100%; padding: 13px 15px; font-size: 15px; font-weight: 500; border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.6); background: rgba(120,120,128,0.1);
            color: var(--7el-dark); outline: none; font-family: inherit; transition: all 0.25s ease;
        }
        .field-row input:focus, .field-row select:focus { background: rgba(255,255,255,0.85); border-color: rgba(0,132,83,0.4); box-shadow: 0 0 0 4px rgba(0,132,83,0.1); }
        .field-hint { font-size: 11.5px; color: #718096; margin-top: 6px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-actions .btn { flex: 1; }

        /* ===== Hộp xác nhận ===== */
        .alert-box { width: 100%; max-width: 300px; background: rgba(250,250,252,0.92); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-radius: 22px; overflow: hidden; text-align: center; transform: scale(0.92); transition: transform 0.3s cubic-bezier(0.34,1.3,0.64,1); }
        .alert-overlay.show .alert-box { transform: scale(1); }
        .alert-body { padding: 20px 18px 16px 18px; }
        .alert-body h2 { font-size: 16px; margin: 0 0 6px 0; font-weight: 700; }
        .alert-body p { font-size: 13px; color: #4a5568; margin: 0; line-height: 1.45; }
        .alert-actions { display: flex; border-top: 1px solid rgba(0,0,0,0.1); }
        .alert-btn { flex: 1; padding: 13px 8px; background: none; border: none; font-size: 15px; font-weight: 600; cursor: pointer; color: var(--7el-green-dark); font-family: inherit; }
        .alert-btn + .alert-btn { border-left: 1px solid rgba(0,0,0,0.1); }
        .alert-btn:active { background: rgba(0,0,0,0.06); }
        .alert-btn-destructive { color: var(--7el-red); font-weight: 700; }

        /* ===== Toast ===== */
        #toast {
            position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 50%;
            transform: translateX(-50%) translateY(-40px); background: rgba(250,250,252,0.9);
            backdrop-filter: blur(26px); -webkit-backdrop-filter: blur(26px); color: var(--7el-dark);
            padding: 13px 20px; border-radius: 18px; font-size: 13.5px; font-weight: 600; z-index: 200;
            box-shadow: 0 14px 34px rgba(0,0,0,0.18); border: 1px solid rgba(255,255,255,0.6);
            opacity: 0; pointer-events: none; transition: all 0.35s cubic-bezier(0.34,1.3,0.64,1); max-width: 90vw;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        #toast.toast-success { color: var(--7el-green-dark); }
        #toast.toast-error { color: var(--7el-red); }

        @media (max-width: 480px) {
            .container { padding: 26px 18px; border-radius: 28px; }
            .sheet-box { padding: 10px 18px calc(20px + env(safe-area-inset-bottom)) 18px; }
            .toolbar-row.second { flex-wrap: nowrap; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-header">
        <h1 class="brand-logo-text">7-<span>ELEVEN</span></h1>
        <div class="stripes"><div class="stripe-orange"></div><div class="stripe-red"></div><div class="stripe-green"></div></div>
        <h3>Tra cứu barcode, quản lý &amp; xuất tem A4</h3>
    </div>

    <div class="toolbar-row">
        <div class="search-wrap">
            <input type="text" id="searchBox" placeholder="Tìm theo tên món hoặc barcode..." oninput="updateView()">
        </div>
        <button class="icon-square-btn" title="Làm mới dữ liệu" onclick="loadData()">🔄</button>
    </div>
    <div class="toolbar-row second">
        <select id="sortSelect" class="sort-select" onchange="updateView()" aria-label="Sắp xếp">
            <option value="barcode_asc">Barcode: nhỏ → lớn</option>
            <option value="barcode_desc">Barcode: lớn → nhỏ</option>
            <option value="missing_first">Thiếu barcode lên đầu</option>
            <option value="name_asc">Tên món: A → Z</option>
            <option value="sheet">Thứ tự trên Sheet</option>
        </select>
        <button class="icon-square-btn" title="Chuẩn hoá &amp; gộp món trùng" onclick="confirmDedupe()">🧹</button>
    </div>

    <button id="btnPrint" class="btn btn-print" onclick="generatePDF_A4()">🖨️ Xuất bản in giấy A4 (mở bao bì 6h sáng mai)</button>

    <div id="loadingText" class="loading">Đang tải dữ liệu hệ thống...</div>
    <div id="emptyHint" class="empty-hint">Không có sản phẩm nào phù hợp.</div>

    <div class="list-meta" id="listMeta" style="display:none;">
        <span id="listCount">0 sản phẩm</span>
        <span id="missingInfo"></span>
    </div>

    <div id="itemList"></div>
</div>

<button class="fab" onclick="openAddModal()" title="Thêm sản phẩm mới">+</button>

<!-- Thêm / sửa -->
<div id="modalOverlay" class="sheet-overlay">
    <div class="sheet-box">
        <div class="sheet-handle"></div>
        <div class="modal-header">
            <h2 id="modalTitle">Thêm sản phẩm</h2>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <form id="itemForm" onsubmit="submitItemForm(event)">
            <div class="field-row">
                <label for="fieldTenMon">Tên món</label>
                <input type="text" id="fieldTenMon" required placeholder="VD: Cơm gà xối mỡ">
            </div>
            <div class="field-row">
                <label for="fieldBarcode">Barcode</label>
                <input type="text" id="fieldBarcode" inputmode="numeric" placeholder="VD: 8938512345678">
            </div>
            <div class="field-row">
                <label for="fieldNhietDo">Điều kiện bảo quản</label>
                <select id="fieldNhietDo">
                    <option value="Ambient">Ambient (nhiệt độ thường)</option>
                    <option value="Chiller">Chiller (mát)</option>
                    <option value="Freezer">Freezer (đông lạnh)</option>
                </select>
            </div>
            <div class="field-row">
                <label for="fieldHanSuDung">Hạn sử dụng (giờ)</label>
                <input type="number" id="fieldHanSuDung" min="1" step="1" inputmode="numeric" placeholder="VD: 24">
                <div class="field-hint">Nhập số giờ. 1 ngày = 24 giờ, 3 ngày = 72 giờ.</div>
            </div>
            <div class="field-row">
                <label for="fieldNgaySanXuat">Ngày sản xuất</label>
                <input type="date" id="fieldNgaySanXuat">
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Huỷ</button>
                <button type="submit" class="btn btn-primary" id="saveBtn">💾 Lưu</button>
            </div>
        </form>
    </div>
</div>

<!-- Hộp xác nhận dùng chung -->
<div id="confirmOverlay" class="alert-overlay">
    <div class="alert-box">
        <div class="alert-body">
            <h2 id="confirmTitle">Xác nhận</h2>
            <p id="confirmMessage"></p>
        </div>
        <div class="alert-actions">
            <button class="alert-btn" onclick="closeOverlay('confirmOverlay')">Huỷ</button>
            <button class="alert-btn alert-btn-destructive" id="confirmOkBtn">Đồng ý</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
    const apiURL = "https://script.google.com/macros/s/AKfycbz2bd0K1BrwnkAaakW2Prhs4NiiMkYByKNjgKRUMCVsV7yR8zwqyXb0pnJb1-HskSkTsA/exec";
    let allData = [];
    let currentFilteredData = [];
    let cachedFontBase64 = null;
    let editingItem = null;      // null = thêm mới; object = đang sửa
    let confirmAction = null;

    window.onload = function () {
        document.getElementById('confirmOkBtn').onclick = () => { if (confirmAction) confirmAction(); };
        document.querySelectorAll('.sheet-overlay, .alert-overlay').forEach(ov => {
            ov.addEventListener('click', e => { if (e.target === ov) closeOverlay(ov.id); });
        });
        loadData();
    };

    // ---------- CHUẨN HOÁ DỮ LIỆU (dự phòng nếu backend trả dữ liệu cũ) ----------
    function toStorage(v) {
        const t = String(v || '').toLowerCase().trim();
        if (!t) return 'Ambient';
        if (t.includes('freezer') || t.includes('đông')) return 'Freezer';
        if (t.includes('chiller') || t.includes('mát') || t.includes('lạnh')) return 'Chiller';
        return 'Ambient';
    }
    function toHours(v) {
        if (v === '' || v === null || v === undefined) return '';
        if (typeof v === 'number') return v > 0 ? v : '';
        const t = String(v).toLowerCase().trim();
        const m = t.match(/\d+(?:[.,]\d+)?/);
        if (!m) return '';
        const n = parseFloat(m[0].replace(',', '.'));
        if (!(n > 0)) return '';
        return (t.includes('ngày') || t.includes('day')) ? n * 24 : n;
    }
    // Trả về yyyy-MM-dd (đúng định dạng của <input type="date">)
    function toDateInput(v) {
        if (!v) return '';
        const s = String(v).trim();
        if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
        const dmy = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
        if (dmy) return `${dmy[3]}-${dmy[2].padStart(2, '0')}-${dmy[1].padStart(2, '0')}`;
        const d = new Date(s);               // dạng ISO có giờ, VD 2026-11-24T17:00:00.000Z
        if (isNaN(d.getTime())) return '';
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    function localISO(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
    function formatDateVN(iso) { return iso ? iso.split('-').reverse().join('/') : ''; }
    function nameKey(s) {
        return String(s || '').toLowerCase().replace(/đ/g, 'd').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9]+/g, ' ').trim();
    }
    function normalizeItem(raw) {
        return {
            _row: raw._row,
            TenMon: String(raw.TenMon || '').replace(/\s+/g, ' ').trim(),
            Barcode: String(raw.Barcode === undefined || raw.Barcode === null ? '' : raw.Barcode).replace(/\s+/g, ''),
            NhietDo: toStorage(raw.NhietDo),
            HanSuDung: toHours(raw.HanSuDung),
            NgaySanXuat: toDateInput(raw.NgaySanXuat)
        };
    }

    // ---------- TẢI DỮ LIỆU ----------
    async function loadData() {
        document.getElementById('loadingText').style.display = 'block';
        document.getElementById('loadingText').innerText = 'Đang tải dữ liệu hệ thống...';
        document.getElementById('itemList').style.display = 'none';
        document.getElementById('emptyHint').style.display = 'none';
        document.getElementById('listMeta').style.display = 'none';
        document.getElementById('btnPrint').style.display = 'none';
        try {
            const response = await fetch(apiURL);
            const data = await response.json();
            if (!Array.isArray(data)) throw new Error('Dữ liệu không hợp lệ');
            allData = data.map(normalizeItem).filter(i => i.TenMon);
            document.getElementById('loadingText').style.display = 'none';
            updateView();
        } catch (error) {
            console.error('Lỗi kết nối:', error);
            document.getElementById('loadingText').innerText = 'Lỗi kết nối database 7-Eleven!';
        }
    }

    // ---------- LỌC + SẮP XẾP + RENDER ----------
    function compareBarcode(a, b) {
        // Số ngắn đứng trước số dài, cùng độ dài so theo từng chữ số (đúng với mã dài hơn 15 số)
        if (a.length !== b.length) return a.length - b.length;
        return a < b ? -1 : a > b ? 1 : 0;
    }
    function sortItems(list, mode) {
        const arr = list.slice();
        const byName = (x, y) => x.TenMon.localeCompare(y.TenMon, 'vi');
        if (mode === 'barcode_asc' || mode === 'barcode_desc') {
            const dir = mode === 'barcode_asc' ? 1 : -1;
            arr.sort((x, y) => {
                if (!x.Barcode && !y.Barcode) return byName(x, y);
                if (!x.Barcode) return 1;                // món thiếu barcode luôn nằm cuối
                if (!y.Barcode) return -1;
                return dir * compareBarcode(x.Barcode, y.Barcode) || byName(x, y);
            });
        } else if (mode === 'missing_first') {
            arr.sort((x, y) => (!!x.Barcode - !!y.Barcode) || byName(x, y));
        } else if (mode === 'name_asc') {
            arr.sort(byName);
        } else {
            arr.sort((x, y) => x._row - y._row);
        }
        return arr;
    }

    function updateView() {
        const q = document.getElementById('searchBox').value.trim().toLowerCase();
        const qKey = nameKey(q);
        let filtered = allData;
        if (q) {
            filtered = allData.filter(i =>
                i.TenMon.toLowerCase().includes(q) || (qKey && nameKey(i.TenMon).includes(qKey)) || i.Barcode.includes(q));
        }
        currentFilteredData = sortItems(filtered, document.getElementById('sortSelect').value);

        const btnPrint = document.getElementById('btnPrint');
        const itemList = document.getElementById('itemList');
        const emptyHint = document.getElementById('emptyHint');
        const listMeta = document.getElementById('listMeta');

        if (currentFilteredData.length === 0) {
            itemList.style.display = 'none'; btnPrint.style.display = 'none'; listMeta.style.display = 'none';
            emptyHint.style.display = 'block';
            emptyHint.innerText = allData.length ? 'Không có sản phẩm nào phù hợp.' : 'Chưa có sản phẩm nào. Bấm + để thêm.';
            return;
        }
        emptyHint.style.display = 'none';
        btnPrint.style.display = 'block';
        listMeta.style.display = 'flex';
        document.getElementById('listCount').innerText = `${currentFilteredData.length} sản phẩm`;
        const missing = currentFilteredData.filter(i => !i.Barcode).length;
        document.getElementById('missingInfo').innerHTML = missing ? `<span style="color:#b3241f">${missing} món thiếu barcode</span>` : '';
        renderList();
    }

    function renderList() {
        const itemList = document.getElementById('itemList');
        itemList.innerHTML = '';
        itemList.style.display = 'flex';

        currentFilteredData.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.innerHTML = `
                <div class="item-card-header">
                    <div class="food-name">${escapeHtml(item.TenMon)}</div>
                    <div class="item-actions">
                        <button class="pill-btn pill-edit" data-idx="${index}">✏️ Sửa</button>
                        <button class="pill-btn pill-delete" data-idx="${index}">🗑️ Xoá</button>
                    </div>
                </div>
                <div class="barcode-container">
                    ${item.Barcode ? `<svg id="barcode-${index}" class="barcode-img"></svg>` : '<span class="no-barcode">Chưa có barcode</span>'}
                </div>
                <div class="item-meta">
                    <span class="badge badge-store">❄️ ${escapeHtml(item.NhietDo)}</span>
                    ${item.HanSuDung ? `<span class="badge badge-expiry">⏱ HSD ${item.HanSuDung} giờ</span>` : '<span class="badge badge-missing">Chưa có HSD</span>'}
                    ${item.NgaySanXuat ? `<span class="badge">📅 NSX ${formatDateVN(item.NgaySanXuat)}</span>` : '<span class="badge badge-missing">Chưa có NSX</span>'}
                </div>`;
            itemList.appendChild(card);
        });

        itemList.querySelectorAll('.pill-edit').forEach(b => b.onclick = () => openEditModal(currentFilteredData[b.dataset.idx]));
        itemList.querySelectorAll('.pill-delete').forEach(b => b.onclick = () => confirmDelete(currentFilteredData[b.dataset.idx]));

        currentFilteredData.forEach((item, index) => {
            if (!item.Barcode) return;
            try {
                JsBarcode(`#barcode-${index}`, item.Barcode, { format: 'CODE128', lineColor: '#000', width: 1.5, height: 45, displayValue: true });
            } catch (err) { console.error('Lỗi tạo mã vạch:', item.TenMon, err); }
        });
    }

    function escapeHtml(str) {
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    // ---------- THÊM / SỬA ----------
    function openAddModal() {
        editingItem = null;
        document.getElementById('modalTitle').innerText = 'Thêm sản phẩm mới';
        document.getElementById('itemForm').reset();
        document.getElementById('fieldNhietDo').value = 'Ambient';
        document.getElementById('fieldNgaySanXuat').value = localISO(new Date());
        openOverlay('modalOverlay');
    }

    function openEditModal(item) {
        editingItem = item;
        document.getElementById('modalTitle').innerText = 'Chỉnh sửa sản phẩm';
        document.getElementById('fieldTenMon').value = item.TenMon;
        document.getElementById('fieldBarcode').value = item.Barcode;
        document.getElementById('fieldNhietDo').value = item.NhietDo;
        document.getElementById('fieldHanSuDung').value = item.HanSuDung;
        document.getElementById('fieldNgaySanXuat').value = item.NgaySanXuat;
        openOverlay('modalOverlay');
    }

    function closeModal() { closeOverlay('modalOverlay'); }

    async function submitItemForm(e) {
        e.preventDefault();
        const item = {
            TenMon: document.getElementById('fieldTenMon').value.replace(/\s+/g, ' ').trim(),
            Barcode: document.getElementById('fieldBarcode').value.replace(/\s+/g, ''),
            NhietDo: document.getElementById('fieldNhietDo').value,
            HanSuDung: document.getElementById('fieldHanSuDung').value.trim(),
            NgaySanXuat: document.getElementById('fieldNgaySanXuat').value
        };
        if (!item.TenMon) { showToast('⚠️ Vui lòng nhập tên món', 'error'); return; }

        const dup = allData.find(i => i !== editingItem && nameKey(i.TenMon) === nameKey(item.TenMon) && i.Barcode === item.Barcode);
        if (dup) { showToast('⚠️ Món này (cùng tên và barcode) đã có, hãy sửa món cũ', 'error'); return; }

        const saveBtn = document.getElementById('saveBtn');
        const originalText = saveBtn.innerText;
        saveBtn.disabled = true;
        saveBtn.innerText = '⏳ Đang lưu...';
        const isEdit = !!editingItem;
        const payload = isEdit
            ? { action: 'update', row: editingItem._row, expectTenMon: editingItem.TenMon, item }
            : { action: 'add', item };
        try {
            await postToAPI(payload);
            closeModal();
            showToast(isEdit ? '✅ Đã cập nhật sản phẩm' : '✅ Đã thêm sản phẩm mới', 'success');
            await loadData();
        } catch (err) {
            showToast('⚠️ Lỗi: ' + err.message, 'error');
        } finally {
            saveBtn.disabled = false;
            saveBtn.innerText = originalText;
        }
    }

    // ---------- XOÁ ----------
    function confirmDelete(item) {
        askConfirm('Xác nhận xoá', `Bạn có chắc muốn xoá "${item.TenMon}" khỏi danh sách?`, 'Xoá', async () => {
            try {
                await postToAPI({ action: 'delete', row: item._row, expectTenMon: item.TenMon });
                closeOverlay('confirmOverlay');
                showToast('✅ Đã xoá sản phẩm', 'success');
                await loadData();
            } catch (err) {
                closeOverlay('confirmOverlay');
                showToast('⚠️ Lỗi: ' + err.message, 'error');
            }
        });
    }

    // ---------- GỘP MÓN TRÙNG ----------
    function confirmDedupe() {
        askConfirm('Gộp món trùng',
            'Chuẩn hoá toàn bộ dữ liệu và gộp các món trùng tên + barcode thành 1 dòng. Hệ thống tự tạo bản backup trên Sheet trước khi gộp.',
            'Gộp ngay', async () => {
                const btn = document.getElementById('confirmOkBtn');
                btn.disabled = true; btn.innerText = 'Đang gộp...';
                try {
                    const r = await postToAPI({ action: 'dedupe' });
                    closeOverlay('confirmOverlay');
                    showToast(`✅ ${r.before} → ${r.after} dòng (gộp ${r.merged}). Backup: ${r.backup}`, 'success');
                    await loadData();
                } catch (err) {
                    closeOverlay('confirmOverlay');
                    showToast('⚠️ Lỗi: ' + err.message, 'error');
                } finally {
                    btn.disabled = false;
                }
            });
    }

    function askConfirm(title, message, okLabel, onOk) {
        document.getElementById('confirmTitle').innerText = title;
        document.getElementById('confirmMessage').innerText = message;
        const btn = document.getElementById('confirmOkBtn');
        btn.innerText = okLabel; btn.disabled = false;
        confirmAction = onOk;
        openOverlay('confirmOverlay');
    }

    // ---------- API ----------
    async function postToAPI(payload) {
        const res = await fetch(apiURL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Lỗi không xác định từ máy chủ');
        return data;
    }

    // ---------- OVERLAY / TOAST ----------
    function openOverlay(id) {
        const el = document.getElementById(id);
        el.classList.add('open');
        requestAnimationFrame(() => el.classList.add('show'));
    }
    function closeOverlay(id) {
        const el = document.getElementById(id);
        el.classList.remove('show');
        setTimeout(() => el.classList.remove('open'), 300);
    }
    let toastTimer = null;
    function showToast(message, type) {
        const toast = document.getElementById('toast');
        toast.innerText = message;
        toast.className = '';
        toast.classList.add('show', type === 'error' ? 'toast-error' : 'toast-success');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // ---------- PDF A4 ----------
    function parseDateTime(date) {
        const d = String(date.getDate()).padStart(2, '0');
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const y = date.getFullYear();
        let hours = date.getHours();
        const minutes = String(date.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        return { dateStr: `${d}/${m}/${y}`, timeStr: `${String(hours).padStart(2, '0')}:${minutes}`, ampm };
    }

    function calculateExpiry(openDate, hours) {
        const h = Number(hours);
        if (!h || h <= 0) return null;
        return new Date(openDate.getTime() + h * 60 * 60 * 1000);
    }

    async function generatePDF_A4() {
        if (currentFilteredData.length === 0) return;
        const btnPrint = document.getElementById('btnPrint');
        const originalBtnText = btnPrint.innerText;
        btnPrint.innerText = '⏳ Đang đồng bộ cấu hình font chữ...';
        btnPrint.disabled = true;

        try {
            if (!cachedFontBase64) {
                const response = await fetch('https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.66/fonts/Roboto/Roboto-Regular.ttf');
                if (!response.ok) throw new Error('Không thể kết nối máy chủ font');
                const bytes = new Uint8Array(await response.arrayBuffer());
                let binary = '';
                for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
                cachedFontBase64 = window.btoa(binary);
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
            doc.addFileToVFS('Roboto-Regular.ttf', cachedFontBase64);
            doc.addFont('Roboto-Regular.ttf', 'RobotoCustom', 'normal');
            doc.addFont('Roboto-Regular.ttf', 'RobotoCustom', 'bold');
            doc.setFont('RobotoCustom', 'normal');

            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(6, 0, 0, 0);
            const openTimeInfo = parseDateTime(tomorrow);

            const tagWidth = 50, tagHeight = 30, startX = 5, startY = 10, maxCols = 4, maxRows = 9;
            const tagsPerPage = maxCols * maxRows;

            currentFilteredData.forEach((item, index) => {
                if (index > 0 && index % tagsPerPage === 0) doc.addPage();
                const pageIndex = index % tagsPerPage;
                const x = startX + (pageIndex % maxCols) * tagWidth;
                const y = startY + Math.floor(pageIndex / maxCols) * tagHeight;
                const splitX = x + 32;

                doc.setDrawColor(120); doc.setLineWidth(0.3);
                doc.rect(x, y, tagWidth, tagHeight);
                doc.line(splitX, y, splitX, y + tagHeight);
                doc.line(x, y + 9, splitX, y + 9);
                doc.line(x, y + 19, splitX, y + 19);
                doc.setTextColor(0, 0, 0);

                doc.setFontSize(5.5); doc.text('SẢN PHẨM:', x + 1.5, y + 3.2);
                doc.setFontSize(6.5);
                let name = (item.TenMon || 'SẢN PHẨM').toUpperCase();
                if (name.length > 22) name = name.substring(0, 20) + '..';
                doc.text(name, x + 1.5, y + 5.8);
                doc.setFontSize(5); doc.text('HSD TRÊN BAO BÌ:', x + 1.5, y + 8.2);

                doc.setFontSize(5.2); doc.text('THỜI GIAN: RÃ ĐÔNG/ MỞ BAO BÌ', x + 1.5, y + 12);
                doc.setFontSize(5);
                doc.text(`NGÀY: ${openTimeInfo.dateStr}`, x + 1.5, y + 15);
                doc.text(`GIỜ:  ${openTimeInfo.timeStr}`, x + 1.5, y + 18);
                doc.rect(splitX - 6.5, y + 13.5, 1.8, 1.8); doc.setFontSize(4.5); doc.text('AM', splitX - 4, y + 15);
                doc.rect(splitX - 6.5, y + 16.5, 1.8, 1.8); doc.text('PM', splitX - 4, y + 18);
                doc.setFontSize(5);
                doc.text('X', splitX - 6.2, openTimeInfo.ampm === 'AM' ? y + 14.9 : y + 17.9);

                doc.setFontSize(5.5); doc.text('THỜI HẠN HỦY', x + 1.5, y + 22.2);
                const expiryDate = calculateExpiry(tomorrow, item.HanSuDung);
                doc.setFontSize(5);
                if (expiryDate) {
                    const e = parseDateTime(expiryDate);
                    doc.text(`NGÀY: ${e.dateStr}`, x + 1.5, y + 25.5);
                    doc.text(`GIỜ:  ${e.timeStr}`, x + 1.5, y + 28.5);
                    doc.rect(splitX - 6.5, y + 23.8, 1.8, 1.8); doc.setFontSize(4.5); doc.text('AM', splitX - 4, y + 25.3);
                    doc.rect(splitX - 6.5, y + 26.8, 1.8, 1.8); doc.text('PM', splitX - 4, y + 28.3);
                    doc.setFontSize(5);
                    doc.text('X', splitX - 6.2, e.ampm === 'AM' ? y + 25.2 : y + 28.2);
                } else {
                    doc.text('NGÀY: ....................', x + 1.5, y + 25.5);
                    doc.text('GIỜ:  ....................', x + 1.5, y + 28.5);
                    doc.rect(splitX - 6.5, y + 23.8, 1.8, 1.8); doc.setFontSize(4.5); doc.text('AM', splitX - 4, y + 25.3);
                    doc.rect(splitX - 6.5, y + 26.8, 1.8, 1.8); doc.text('PM', splitX - 4, y + 28.3);
                }

                doc.setFontSize(5.5);
                doc.text('ĐK Bảo', splitX + 2, y + 3.5);
                doc.text('Quản:', splitX + 2, y + 5.8);
                doc.setFontSize(4.8);
                doc.rect(splitX + 2, y + 8.5, 1.8, 1.8); doc.text('Freezer', splitX + 4.8, y + 10);
                doc.rect(splitX + 2, y + 11.5, 1.8, 1.8); doc.text('Chiller', splitX + 4.8, y + 13);
                doc.rect(splitX + 2, y + 14.5, 1.8, 1.8); doc.text('Ambient', splitX + 4.8, y + 16);
                doc.setFontSize(5);
                const markY = item.NhietDo === 'Freezer' ? 9.9 : item.NhietDo === 'Chiller' ? 12.9 : 15.9;
                doc.text('X', splitX + 2.2, y + markY);

                doc.setFontSize(5.5); doc.text('Nhân Viên:', splitX + 2, y + 21);
                doc.setFontSize(6.5); doc.setFont('RobotoCustom', 'bold');
                doc.text('HUY', splitX + 2, y + 25);
                doc.setFont('RobotoCustom', 'normal');
                if (item.NgaySanXuat) {
                    doc.setFontSize(4.2);
                    doc.text(`NSX: ${formatDateVN(item.NgaySanXuat)}`, splitX + 2, y + 28.6);
                }
            });

            doc.save('Form_In_A4_7Eleven.pdf');
        } catch (error) {
            console.error('Lỗi xuất PDF:', error);
            alert('Đã xảy ra lỗi khi tạo file PDF. Vui lòng thử lại!');
        } finally {
            btnPrint.innerText = originalBtnText;
            btnPrint.disabled = false;
        }
    }
</script>
